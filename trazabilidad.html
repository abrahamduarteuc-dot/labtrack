<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trazabilidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F2F5;--surface:#fff;--surface2:#F7F8FA;--border:#E2E5EA;
  --accent:#1A56DB;--accent-light:#EBF0FD;
  --accent2:#0E9F6E;--accent2-light:#E8F8F2;
  --warn:#E3A008;--warn-light:#FDF3D0;
  --danger:#DC2626;--danger-light:#FEE2E2;
  --text:#1A1F2E;--text2:#6B7280;--text3:#9CA3AF;
  --r:14px;--rs:8px;
  --sh:0 2px 12px rgba(0,0,0,.07);--shl:0 8px 32px rgba(0,0,0,.12);
  --f:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--f);background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;}
button{font-family:var(--f);}

.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:var(--sh);}
.hdr-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;}
.hdr-logo{width:30px;height:30px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:15px;}
.hdr-sub{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;}

.pg{padding:16px;max-width:900px;margin:0 auto;padding-bottom:44px;}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px;}
.card-t{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.card-d{font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.45;}

.fld{margin-bottom:13px;}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;}
.fld label .req{color:var(--danger);}
.fld input{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:var(--rs);font-size:15px;font-family:var(--f);background:var(--surface);color:var(--text);}
.fld input:focus{outline:none;border-color:var(--accent);}

.btn{width:100%;padding:13px;border:none;border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:opacity .15s,transform .1s;}
.btn:active{transform:scale(.985);}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn-p{background:var(--accent);color:white;}
.btn-w{background:var(--surface2);color:var(--text);border:1.5px solid var(--border);}
.btn-row{display:flex;gap:9px;}
.btn-row .btn{flex:1;}

.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
.spin-d{border-color:rgba(26,86,219,.25);border-top-color:var(--accent);}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── SELECTOR DE CÓDIGOS ── */
.sel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;gap:10px;}
.sel-count{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-light);padding:4px 10px;border-radius:20px;white-space:nowrap;}
.sel-search{position:relative;margin-bottom:9px;}
.sel-search input{width:100%;padding:10px 12px 10px 34px;border:1.5px solid var(--border);border-radius:var(--rs);font-size:14px;font-family:var(--f);}
.sel-search input:focus{outline:none;border-color:var(--accent);}
.sel-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none;}
.sel-box{border:1.5px solid var(--border);border-radius:var(--rs);max-height:260px;overflow-y:auto;background:var(--surface2);}
.sel-i{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.sel-i:last-child{border-bottom:none;}
.sel-i:hover{background:var(--accent-light);}
.sel-i.on{background:var(--accent-light);}
.sel-cb{width:19px;height:19px;border:2px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface);font-size:12px;color:white;transition:all .12s;}
.sel-i.on .sel-cb{background:var(--accent);border-color:var(--accent);}
.sel-c{font-weight:700;font-size:14px;letter-spacing:.02em;}
.sel-empty{padding:24px;text-align:center;color:var(--text3);font-size:13px;}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.chip{background:var(--accent-light);color:var(--accent);padding:4px 9px;border-radius:20px;font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:5px;}
.chip span{cursor:pointer;opacity:.6;font-weight:400;}
.chip span:hover{opacity:1;}

/* ── RESULTADOS ── */
.res-head{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px;}
.res-t{font-size:19px;font-weight:800;margin-bottom:3px;}
.res-m{font-size:13px;color:var(--text2);line-height:1.6;}
.res-m b{color:var(--text);font-weight:600;}

.tbl-wrap{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);overflow-x:auto;margin-bottom:14px;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px;}
th{background:var(--surface2);padding:10px 11px;text-align:left;font-size:10.5px;font-weight:800;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;border-bottom:1.5px solid var(--border);white-space:nowrap;}
td{padding:10px 11px;border-bottom:1px solid var(--border);vertical-align:top;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface2);}
.t-cod{font-weight:800;color:var(--accent);white-space:nowrap;}
.t-lote{font-weight:700;}
.t-env{font-size:11px;color:var(--text3);white-space:nowrap;}
.t-obs{font-weight:600;white-space:nowrap;}
.obs-ok{color:var(--accent2);}
.obs-venc{color:var(--danger);}
.obs-post{color:var(--warn);}
.obs-cerr{color:var(--text2);}

.grp{font-size:12px;font-weight:800;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;margin:20px 0 9px;display:flex;align-items:center;gap:8px;}
.grp-n{background:var(--surface2);color:var(--text2);padding:2px 8px;border-radius:20px;font-size:11px;}

.toggle{display:flex;align-items:center;gap:9px;padding:12px 14px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);cursor:pointer;margin-bottom:14px;font-size:13.5px;font-weight:500;}
.toggle-sw{width:40px;height:23px;background:var(--border);border-radius:14px;position:relative;transition:background .18s;flex-shrink:0;}
.toggle-sw:after{content:'';position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;background:white;border-radius:50%;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on .toggle-sw{background:var(--accent);}
.toggle.on .toggle-sw:after{transform:translateX(17px);}

.empty{text-align:center;padding:44px 20px;color:var(--text3);background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);}
.empty-ic{font-size:38px;margin-bottom:10px;opacity:.5;}
.empty-t{font-size:15px;font-weight:700;color:var(--text2);margin-bottom:5px;}
.empty-d{font-size:13px;line-height:1.55;max-width:360px;margin:0 auto;}

.nota{font-size:11.5px;color:var(--text3);line-height:1.6;padding:12px 14px;background:var(--surface2);border-radius:var(--rs);border-left:3px solid var(--border);margin-bottom:14px;}

/* ── ALERTA ── */
.alert-ov{position:fixed;inset:0;background:rgba(15,20,35,.55);backdrop-filter:blur(3px);z-index:1100;display:none;align-items:center;justify-content:center;padding:20px;}
.alert-ov.open{display:flex;}
.alert-box{background:var(--surface);border-radius:20px;padding:26px 22px;max-width:380px;width:100%;text-align:center;box-shadow:var(--shl);animation:pop .25s cubic-bezier(.2,.9,.3,1);}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.alert-ic{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:27px;margin:0 auto 14px;}
.alert-ic.ok{background:var(--accent2-light);}
.alert-ic.warn{background:var(--warn-light);}
.alert-ic.err{background:var(--danger-light);}
.alert-ic.info{background:var(--accent-light);}
.alert-t{font-size:18px;font-weight:800;margin-bottom:7px;}
.alert-d{font-size:14px;color:var(--text2);line-height:1.55;margin-bottom:20px;}

/* ── IMPRESIÓN A4 ── */
@media print{
  @page{size:A4;margin:12mm;}
  body{background:white;font-size:10.5px;}
  .hdr,.btn,.btn-row,.toggle,.no-print{display:none!important;}
  .pg{padding:0;max-width:100%;}
  .card{display:none;}
  .res-head{box-shadow:none;border:1px solid #E2E5EA;padding:10px 12px;margin-bottom:8mm;border-radius:4px;}
  .res-t{font-size:15px;}
  .tbl-wrap{box-shadow:none;border:1px solid #E2E5EA;border-radius:4px;overflow:visible;}
  table{min-width:0;font-size:9.5px;}
  th{padding:5px 6px;font-size:8px;}
  td{padding:5px 6px;}
  tr{break-inside:avoid;page-break-inside:avoid;}
  thead{display:table-header-group;}
  .grp{margin:6mm 0 3mm;font-size:10px;}
  .nota{font-size:8.5px;}
  .print-only{display:block!important;}
}
.print-only{display:none;}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-brand">
    <div class="hdr-logo">🔍</div>
    <div>
      <div>Trazabilidad</div>
    </div>
  </div>
</header>

<section class="pg">

  <!-- ══════ FORMULARIO ══════ -->
  <div id="form">

    <div class="card">
      <div class="card-t">📅 Fecha objetivo</div>
      <div class="card-d">Indica el día de la fabricación que quieres investigar.</div>
      <div class="fld" style="margin-bottom:0;">
        <input type="date" id="fecha">
      </div>
    </div>

    <div class="card">
      <div class="sel-head">
        <div class="card-t" style="margin:0;">🧪 Materias primas</div>
        <div class="sel-count" id="contador">0 seleccionados</div>
      </div>
      <div class="card-d">Elige uno o varios códigos.</div>

      <div class="fld" style="margin-bottom:10px;">
        <textarea id="pegar" rows="3" placeholder="Pega aquí una lista de códigos desde Excel (uno por línea, o separados por coma o espacio)" style="width:100%;padding:10px 12px;border:1px solid #E2E5EA;border-radius:8px;font:inherit;font-size:13px;resize:vertical;"></textarea>
        <button class="btn btn-w" style="padding:8px;font-size:12.5px;margin-top:6px;" onclick="agregarLista()">Agregar lista pegada</button>
        <div id="pegarMsg" style="font-size:12.5px;margin-top:6px;"></div>
      </div>

      <div class="sel-search">
        <span class="sel-ic">🔍</span>
        <input type="text" id="buscar" placeholder="Buscar código" oninput="renderCodigos()">
      </div>

      <div class="btn-row" style="margin-bottom:10px;">
        <button class="btn btn-w" style="padding:8px;font-size:12.5px;" onclick="seleccionarVisibles()">Seleccionar visibles</button>
        <button class="btn btn-w" style="padding:8px;font-size:12.5px;" onclick="limpiarSeleccion()">Limpiar</button>
      </div>

      <div class="sel-box" id="selBox"></div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-w" onclick="limpiarTodo()">Cancelar</button>
      <button class="btn btn-p" id="btnConsultar" onclick="consultar()">🔍 Consultar</button>
    </div>

  </div>

  <!-- ══════ RESULTADOS ══════ -->
  <div id="resultados" style="display:none;"></div>

</section>

<div class="alert-ov" id="ovAlert"><div class="alert-box" id="alertBox"></div></div>

<script>
// ═══════════════════════════════════════════════════════════
// ⚙️ CONFIGURACIÓN — EDITAR ANTES DE USAR
// ═══════════════════════════════════════════════════════════
const CFG = {
  // Misma URL del Apps Script que usa LabTrack
  API_URL: 'https://script.google.com/macros/s/AKfycbzDNEkZW0ewVasAvxd1ZFqMW_93SOGA2xS0FJqO881lyemKQNA5Z4qfXVnwV7kQ9qyfjQ/exec',
  ORG: 'LABTRACK'
};

let ST = {
  catalogo: [],
  seleccionados: new Set(),
  ultimaConsulta: null,
  verDescartados: false
};

// ═══════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════
async function apiGet(params, timeoutMs){
  if(CFG.API_URL.indexOf('PEGAR_AQUI') === 0) throw new Error('API_URL sin configurar');
  const url = CFG.API_URL + '?' + new URLSearchParams(params).toString();
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), timeoutMs || 45000);
  try{
    const r = await fetch(url, { method:'GET', signal: ctrl.signal, redirect:'follow' });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error ? j.error.detail : j.message);
    return j.data;
  } finally { clearTimeout(t); }
}

// ═══════════════════════════════════════════════════════════
// UTILIDADES
// ═══════════════════════════════════════════════════════════
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtFecha(iso){
  if(!iso || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return '—';
  const p = iso.substring(0,10).split('-');
  return p[2]+'/'+p[1]+'/'+p[0];
}

function hoyISO(){
  const d = new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}

function alerta(opts){
  const box = document.getElementById('alertBox');
  const tipo = opts.tipo || 'info';
  const iconos = { ok:'✅', warn:'⚠️', err:'✕', info:'ℹ️' };
  let h = '<div class="alert-ic '+tipo+'">'+(opts.icono || iconos[tipo])+'</div>'
        + '<div class="alert-t">'+esc(opts.titulo)+'</div>';
  if(opts.texto) h += '<div class="alert-d">'+opts.texto+'</div>';
  const btns = opts.botones || [{txt:'Entendido', clase:'btn-p'}];
  h += btns.length > 1 ? '<div class="btn-row">' : '<div>';
  btns.forEach((b,i)=>{ h += '<button class="btn '+(b.clase||'btn-w')+'" data-i="'+i+'">'+b.txt+'</button>'; });
  h += '</div>';
  box.innerHTML = h;
  box.querySelectorAll('button[data-i]').forEach(btn=>{
    btn.onclick = ()=>{ const b = btns[parseInt(btn.dataset.i,10)]; cerrarAlerta(); if(b.fn) setTimeout(b.fn,120); };
  });
  document.getElementById('ovAlert').classList.add('open');
}
function cerrarAlerta(){ document.getElementById('ovAlert').classList.remove('open'); }

// ═══════════════════════════════════════════════════════════
// CATÁLOGO Y SELECTOR
// ═══════════════════════════════════════════════════════════
async function cargarCatalogo(){
  // Caché local para arrancar rápido
  try{
    const c = JSON.parse(localStorage.getItem('traza_catalogo') || 'null');
    if(c && c.length){ ST.catalogo = c; renderCodigos(); }
  }catch(e){}

  try{
    const d = await apiGet({ accion:'catalogo' });
    if(d.catalogo && d.catalogo.length){
      // Solo los códigos — sin nombre de producto, por requerimiento
      ST.catalogo = d.catalogo.map(x => x.c).sort();
      localStorage.setItem('traza_catalogo', JSON.stringify(ST.catalogo));
      renderCodigos();
    }
  }catch(e){
    if(!ST.catalogo.length){
      document.getElementById('selBox').innerHTML =
        '<div class="sel-empty">No se pudo cargar el catálogo.<br>'+esc(e.message)+'</div>';
    }
  }
}

function codigosVisibles(){
  const q = document.getElementById('buscar').value.trim().toUpperCase();
  if(!q) return ST.catalogo;
  return ST.catalogo.filter(c => c.indexOf(q) > -1);
}

function renderCodigos(){
  const box = document.getElementById('selBox');
  const vis = codigosVisibles();

  if(!vis.length){
    box.innerHTML = '<div class="sel-empty">' + (ST.catalogo.length ? 'Sin coincidencias' : 'Cargando catálogo...') + '</div>';
  }else{
    // Limitar el render a 300 para no bloquear el móvil con 920 nodos
    const lista = vis.slice(0, 300);
    box.innerHTML = lista.map(c =>
      '<div class="sel-i'+(ST.seleccionados.has(c)?' on':'')+'" onclick="toggleCodigo(\''+esc(c)+'\')">'
      + '<div class="sel-cb">'+(ST.seleccionados.has(c)?'✓':'')+'</div>'
      + '<div class="sel-c">'+esc(c)+'</div></div>'
    ).join('')
    + (vis.length > 300 ? '<div class="sel-empty">Mostrando 300 de '+vis.length+'. Afina la búsqueda.</div>' : '');
  }

  renderChips();
}

function renderChips(){
  const n = ST.seleccionados.size;
  document.getElementById('contador').textContent = n + ' seleccionado' + (n===1?'':'s');
  const chips = document.getElementById('chips');
  if(!n){ chips.innerHTML = ''; return; }
  chips.innerHTML = [...ST.seleccionados].sort().map(c =>
    '<div class="chip">'+esc(c)+'<span onclick="toggleCodigo(\''+esc(c)+'\')">✕</span></div>'
  ).join('');
}

function toggleCodigo(c){
  if(ST.seleccionados.has(c)) ST.seleccionados.delete(c);
  else ST.seleccionados.add(c);
  renderCodigos();
}

function seleccionarVisibles(){
  const vis = codigosVisibles().slice(0, 300);
  if(!vis.length) return;
  vis.forEach(c => ST.seleccionados.add(c));
  renderCodigos();
}

function parsearCodigos(txt){
  return (txt||'').toUpperCase().split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean);
}

function agregarLista(){
  const lista = parsearCodigos(document.getElementById('pegar').value);
  const msg = document.getElementById('pegarMsg');
  if(!lista.length){ msg.style.color='#B45309'; msg.textContent='No hay códigos para agregar.'; return; }
  if(!ST.catalogo.length){ msg.style.color='#B45309'; msg.textContent='El catálogo aún no carga. Intenta en unos segundos.'; return; }
  const set = new Set(ST.catalogo);
  let ok=0, noEnc=[];
  new Set(lista).forEach(c=>{ if(set.has(c)){ ST.seleccionados.add(c); ok++; } else noEnc.push(c); });
  document.getElementById('pegar').value = noEnc.join('\n');
  if(noEnc.length){
    msg.style.color='#B45309';
    msg.innerHTML = ok+' agregado(s). <b>'+noEnc.length+' no están en el catálogo</b> y quedaron en la caja para revisar: '+esc(noEnc.slice(0,8).join(', '))+(noEnc.length>8?'…':'');
  }else{
    msg.style.color='#1B7F3B';
    msg.textContent = ok+' código(s) agregado(s).';
  }
  renderCodigos();
}

function limpiarSeleccion(){
  ST.seleccionados.clear();
  document.getElementById('pegar').value=''; document.getElementById('pegarMsg').textContent='';
  renderCodigos();
}

function limpiarTodo(){
  ST.seleccionados.clear();
  document.getElementById('buscar').value = '';
  document.getElementById('fecha').value = hoyISO();
  document.getElementById('form').style.display = 'block';
  document.getElementById('resultados').style.display = 'none';
  renderCodigos();
  window.scrollTo(0,0);
}

// ═══════════════════════════════════════════════════════════
// CONSULTA
// ═══════════════════════════════════════════════════════════
async function consultar(){
  const fecha = document.getElementById('fecha').value;

  if(!fecha){
    alerta({ tipo:'warn', titulo:'Falta la fecha', texto:'Indica la fecha objetivo que quieres consultar.' });
    return;
  }
  if(!ST.seleccionados.size){
    alerta({ tipo:'warn', titulo:'Sin materias primas', texto:'Selecciona al menos un código para consultar.' });
    return;
  }

  const btn = document.getElementById('btnConsultar');
  btn.innerHTML = '<span class="spin"></span> Consultando...';
  btn.disabled = true;

  try{
    const d = await apiGet({
      accion: 'trazabilidad',
      fecha: fecha,
      codigos: [...ST.seleccionados].join(',')
    });
    ST.ultimaConsulta = d;
    renderResultados(d);
  }catch(e){
    alerta({ tipo:'err', titulo:'No se pudo consultar', texto: esc(e.message) });
  }finally{
    btn.innerHTML = '🔍 Consultar';
    btn.disabled = false;
  }
}

function renderResultados(d){
  const cont = document.getElementById('resultados');
  document.getElementById('form').style.display = 'none';
  cont.style.display = 'block';

  let h = '<div class="res-head">'
    + '<div class="res-t">Consulta de trazabilidad</div>'
    + '<div class="res-m">'
    +   'Fecha objetivo: <b>'+fmtFecha(d.fecha_objetivo)+'</b><br>'
    +   'Códigos consultados: <b>'+esc(d.codigos_consultados.join(', '))+'</b><br>'
    +   'Generado: <b>'+esc(String(d.generado).replace('T',' ').substring(0,16))+'</b>'
    + '</div></div>';

  // ── Coincidencias
  if(!d.coincidencias.length){
    h += '<div class="empty"><div class="empty-ic">🔎</div>'
      + '<div class="empty-t">Sin lotes disponibles</div>'
      + '<div class="empty-d">No se encontraron lotes disponibles para los códigos y la fecha seleccionados.</div></div>';
  }else{
    h += '<div class="grp">Lotes disponibles <span class="grp-n">'+d.coincidencias.length+'</span></div>';
    h += tabla(d.coincidencias);
  }

  // ── Descartados (opcional)
  if(d.descartados.length){
    h += '<div class="toggle no-print'+(ST.verDescartados?' on':'')+'" onclick="toggleDescartados()">'
      + '<div class="toggle-sw"></div>'
      + '<div>Mostrar registros descartados ('+d.descartados.length+')</div></div>';

    if(ST.verDescartados){
      h += '<div class="grp">Registros descartados <span class="grp-n">'+d.descartados.length+'</span></div>';
      h += tabla(d.descartados);
    }
  }

  h += '<div class="nota">Este informe refleja únicamente los registros existentes en la base de datos '
    + 'a la fecha de generación. La ausencia de resultados no constituye prueba de que un material no fue utilizado.</div>';

  h += '<div class="btn-row no-print" style="margin-top:16px;">'
    + '<button class="btn btn-w" onclick="limpiarTodo()">Nueva consulta</button>'
    + '<button class="btn btn-p" onclick="window.print()">🖨️ Imprimir / PDF</button>'
    + '</div>';

  cont.innerHTML = h;
  window.scrollTo(0,0);
}

function tabla(filas){
  const clases = {
    disponible: 'obs-ok',
    vencido:    'obs-venc',
    posterior:  'obs-post',
    cerrado:    'obs-cerr',
    incompleto: ''
  };

  return '<div class="tbl-wrap"><table><thead><tr>'
    + '<th>Código</th><th>Lote</th><th>Proveedor</th><th>Fabricante</th>'
    + '<th>Ingreso</th><th>Vencimiento</th><th>Envase</th><th>Observación</th>'
    + '</tr></thead><tbody>'
    + filas.map(r =>
        '<tr>'
        + '<td class="t-cod">'+esc(r.codigo_mp)+'</td>'
        + '<td class="t-lote">'+esc(r.lote || '—')+'</td>'
        + '<td>'+esc(r.proveedor || '—')+'</td>'
        + '<td>'+esc(r.fabricante || '—')+'</td>'
        + '<td>'+fmtFecha(r.fecha_ingreso)+'</td>'
        + '<td>'+fmtFecha(r.fecha_vencimiento)+'</td>'
        + '<td class="t-env">'+esc(r.envase_id)+'</td>'
        + '<td class="t-obs '+(clases[r.clase]||'')+'">'+esc(r.observacion)+'</td>'
        + '</tr>'
      ).join('')
    + '</tbody></table></div>';
}

function toggleDescartados(){
  ST.verDescartados = !ST.verDescartados;
  if(ST.ultimaConsulta) renderResultados(ST.ultimaConsulta);
}

// ═══════════════════════════════════════════════════════════
// INICIO
// ═══════════════════════════════════════════════════════════
(function init(){
  document.getElementById('fecha').value = hoyISO();

  if(CFG.API_URL.indexOf('PEGAR_AQUI') === 0){
    setTimeout(()=>alerta({
      tipo:'warn',
      titulo:'Falta configurar la API',
      texto:'Edita <b>CFG.API_URL</b> en este archivo con la URL del despliegue del Apps Script.'
    }), 500);
    return;
  }

  cargarCatalogo().then(aplicarParametrosURL);
})();

// Permite abrir la página ya preparada: trazabilidad.html?fecha=2026-10-10&codigos=V5048,V5049
function aplicarParametrosURL(){
  try{
    const q = new URLSearchParams(location.search);
    const f = q.get('fecha'), c = q.get('codigos');
    if(f && /^\d{4}-\d{2}-\d{2}$/.test(f)) document.getElementById('fecha').value = f;
    if(c){
      const set = new Set(ST.catalogo);
      parsearCodigos(c).forEach(x=>{ if(set.has(x)) ST.seleccionados.add(x); });
      renderCodigos();
      if(ST.seleccionados.size && f) consultar();
    }
  }catch(e){}
}
</script>
